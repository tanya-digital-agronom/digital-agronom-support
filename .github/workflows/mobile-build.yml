name: Build mobile preview (Android + iOS)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'

# Avoid compiling every intermediate commit when multiple mobile files change.
concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Android · debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and verify mobile CRM
        run: npm run build && npm run verify
      - name: Generate native Android project
        run: npx cap add android && npx cap sync android
      - name: Configure Firebase Cloud Messaging for Android
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          else
            cp firebase/google-services.json android/app/google-services.json
          fi
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("android/app/google-services.json", "utf8"));
            const target = "ru.digitalagronom.support";
            if (!cfg.client?.some(x => x.client_info?.android_client_info?.package_name === target))
              throw Error("Firebase config does not match Android package " + target);
            if (!cfg.project_info?.project_id) throw Error("Firebase project ID is missing");
            console.log("Firebase Android client validated:",cfg.project_info.project_id);
          '
      - name: Compile debug APK
        run: cd android && chmod +x ./gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: digital-agronom-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iPhone · simulator app (unsigned)
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and verify mobile CRM
        run: npm run build && npm run verify
      - name: Generate native iOS project
        run: npx cap add ios && npx cap sync ios
      - name: Add Apple Push Notifications callbacks
        run: node scripts/configure-ios-push.mjs
      - name: Compile for iOS Simulator (without Apple signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator
          zip -qr ../../../../digital-agronom-ios-simulator.zip App.app
      - uses: actions/upload-artifact@v4
        with:
          name: digital-agronom-ios-simulator
          path: mobile/digital-agronom-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
